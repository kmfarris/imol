name: Skill train

# Trains sparse router weights from oracle trajectories (no LLM API key).
# Download router-weights artifact; do not auto-commit to main from CI.

on:
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run skill:train
      - uses: actions/upload-artifact@v4
        with:
          name: router-weights
          path: packages/imol-skill/codebook/router-weights.json
